name: Verify Luminar Apify examples

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node scripts/verify.mjs
      - run: node --check runners/javascript/run-actor.mjs
      - run: find actors -path '*/javascript/*.mjs' -print0 | xargs -0 -n1 node --check
      - run: python -m compileall -q runners/python actors
      - shell: pwsh
        run: ./scripts/parse-powershell.ps1

